# Build gitprompt and run the suite on the Unix platforms it supports.
#
# The Windows build is developed on Windows.  These two are the ones the
# platform code in the source has to satisfy, and they are run here rather than
# on the development machine because that machine has no Unix toolchain.
# git is installed on both runners, which the suite's interop section needs --
# that section is the one that tests the claim the whole design rests on, that
# a gitprompt repository is an ordinary git repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: they fail for different
      # reasons, and one run should say what both of them do.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          if make 2>&1 | tee "$RUNNER_TEMP/build.log"; then exit 0; fi
          # A step's own log needs a token to read back and the machine this is
          # read from has none; its annotations do not, so the failure goes
          # there -- the compiler's error lines, and then the end of the output
          # for anything they do not account for.
          { grep -E ': (error|fatal error)' "$RUNNER_TEMP/build.log" | head -20
            tail -20 "$RUNNER_TEMP/build.log"; } |
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          exit 1

      - name: test
        run: |
          if make test 2>&1 | tee "$RUNNER_TEMP/test.log"; then exit 0; fi
          tail -50 "$RUNNER_TEMP/test.log" |
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          exit 1
