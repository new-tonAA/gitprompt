# Build gitprompt and run the suite on every platform it supports.
#
# These are the three git itself runs on, and they are run here because the
# development machine has one compiler for one of them.  git is installed on
# every runner, which the suite's interop section needs -- that section is the
# one that tests the claim the whole design rests on, that a gitprompt
# repository is an ordinary git repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: they fail for different
      # reasons, and one run should say what both of them do.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # A step fails when its command fails, and nothing here should stand
      # between the two: a pipe would report the status of whatever it was
      # piped into, and a suite that fails inside one would leave the run
      # green.
      - name: build
        run: make

      - name: test
        run: make test

  windows:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Windows ships no compiler and no make, so MSYS2 supplies them.  MINGW64
      # is picked over UCRT64 deliberately: the vendored third_party/zlib/libz.a
      # is a msvcrt build of the library, and UCRT64 links a different C
      # runtime against it.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            git
            mingw-w64-x86_64-gcc

      - name: build
        shell: msys2 {0}
        run: make

      - name: test
        shell: msys2 {0}
        run: make test
