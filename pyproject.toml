[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitprompt"
version = "0.1.0"
description = "A distributed version control system for prompts — the second git."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-only" }
authors = [{ name = "new-tonAA", email = "newtonaa@qq.com" }]
keywords = ["git", "prompt", "llm", "agent", "version-control"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.scripts]
gitprompt = "gitprompt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
